<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>声で進むプロンプター</title>
<style>
  /* 画面は2つだけ。原稿を貼る画面と、読む画面。読む画面は黒地に白文字で固定。 */
  :root {
    color-scheme: dark;
    --bg: #0b0c0e;
    --panel: #17191d;
    --line: #2c3037;
    --text: #f4f2ec;
    --muted: #9a9ca3;
    --past: #565a62;
    --accent: #ffb224;
    --danger: #ff6b5e;
    --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--font); line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }
  button {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; min-height: 44px; cursor: pointer;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  button:active { background: #23262c; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---- 原稿を貼る画面 ---- */
  #edit {
    height: 100%; display: flex; flex-direction: column; gap: 14px;
    max-width: 760px; margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  #edit h1 { font-size: 22px; margin: 0; letter-spacing: .02em; }
  #edit p { margin: 0; color: var(--muted); font-size: 14px; }
  #text {
    flex: 1; min-height: 160px; width: 100%; resize: none;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; font: inherit; font-size: 17px; line-height: 1.8;
  }
  #start {
    background: var(--accent); color: #1a1200; border-color: var(--accent);
    font-weight: 700; font-size: 18px; min-height: 56px;
  }
  #start:active { background: #e89f17; }
  #notice {
    border: 1px solid var(--danger); color: var(--text); background: #2a1512;
    border-radius: 10px; padding: 10px 14px; font-size: 14px;
  }

  #info {
    border: 1px solid #4ad27a; color: var(--text); background: #12251a;
    border-radius: 10px; padding: 10px 14px; font-size: 14px;
  }
  #edit .row { display: flex; gap: 8px; }
  #edit .row button { flex: 1; font-size: 15px; }
  #clear {
    align-self: flex-end; margin-top: -4px; padding: 6px 14px; font-size: 14px;
    background: transparent; color: var(--text); border: 1px solid #565a62; border-radius: 8px;
  }

  /* ---- QRコードで送る・受け取る画面 ---- */
  #qr {
    position: fixed; inset: 0; z-index: 10; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 16px; text-align: center;
  }
  #qr p { margin: 0; font-size: 15px; }
  #qrProg { color: var(--accent); font-weight: 700; min-height: 1.7em; }
  #qrCanvas {
    width: min(84vmin, 560px); height: min(84vmin, 560px);
    background: #fff; border-radius: 8px; image-rendering: pixelated;
  }
  #qrVideo { width: min(84vmin, 560px); max-height: 56vh; border-radius: 8px; background: #000; object-fit: cover; }

  /* ---- 読む画面 ---- */
  #stage { height: 100%; display: flex; flex-direction: column; }
  #scroller { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #script {
    position: relative;
    padding: 28vh 5vw 70vh;
    font-size: 48px; font-weight: 700; line-height: 1.55;
    white-space: pre-wrap; overflow-wrap: anywhere; line-break: strict;
  }
  #script.mirror { transform: scaleX(-1); }
  #past { color: var(--past); }
  /* 色は3つだけ:読み終わり=暗いグレー / 今読む文=黄色 / これから=白 */
  #curRead, #curNext { color: #ffc83d; }

  #bar {
    /* ボタンは必ず1行。画面が狭いときは、ボタンの幅を均等に縮めて収める */
    display: flex; flex-wrap: nowrap; align-items: center; justify-content: center; gap: 4px;
    background: var(--panel); border-top: 1px solid var(--line);
    padding: 6px max(8px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
  }
  #bar button {
    flex: 1 1 0; min-width: 0; max-width: 88px; padding: 8px 0; font-size: 15px;
    display: flex; align-items: center; justify-content: center; white-space: nowrap;
  }
  #bar svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #mirror[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  #mic {
    flex: none; display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 12px; color: var(--muted); min-width: 28px; min-height: 44px; white-space: nowrap;
  }
  #micText { display: none; }
  #mic.err #micText { display: inline; }
  #mic i { width: 10px; height: 10px; border-radius: 50%; background: var(--past); flex: none; }
  #mic.on i { background: #4ad27a; }
  #mic.err { color: var(--danger); }
  #mic.err i { background: var(--danger); }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>

<!-- 原稿を貼る画面 -->
<main id="edit">
  <h1>声で進むプロンプター</h1>
  <p>原稿を貼って「スタート」を押し、読み始めてください。声に合わせて進みます。</p>
  <div id="notice" hidden></div>
  <div id="info" hidden></div>
  <textarea id="text" aria-label="原稿" placeholder="ここに原稿を貼り付けます"></textarea>
  <button id="clear" type="button">原稿を消す</button>
  <div class="row">
    <button id="send" type="button">スマホに送る（QR表示）</button>
    <button id="recv" type="button">QRで受け取る</button>
  </div>
  <button id="start" type="button">スタート</button>
  <p id="ver" style="text-align:center;font-size:12px"></p>
</main>

<!-- QRコードで送る・受け取る画面 -->
<div id="qr" hidden>
  <p id="qrMsg"></p>
  <canvas id="qrCanvas" hidden></canvas>
  <video id="qrVideo" playsinline muted hidden></video>
  <p id="qrProg"></p>
  <button id="qrClose" type="button">閉じる</button>
</div>

<!-- 読む画面 -->
<div id="stage" hidden>
  <div id="scroller">
    <div id="script"><span id="past"></span><span id="curRead"></span><span id="curNext"></span><span id="future"></span></div>
  </div>
  <div id="bar">
    <div id="mic" role="status"><i></i><span id="micText">準備中</span></div>
    <button id="back" type="button" aria-label="原稿に戻る">原稿</button>
    <button id="top" type="button" aria-label="最初から"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button id="prev" type="button" aria-label="前の文へ">◀</button>
    <button id="next" type="button" aria-label="次の文へ">▶</button>
    <button id="smaller" type="button" aria-label="文字を小さく">小</button>
    <button id="bigger" type="button" aria-label="文字を大きく">大</button>
    <button id="align" type="button" aria-label="揃え"><svg viewBox="0 0 24 24" aria-hidden="true"></svg></button>
    <button id="mirror" type="button" aria-pressed="false" aria-label="左右反転">反転</button>
  </div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

  // ---- 版の確認 ----
  // スマホは古いページをしばらく覚えている。開いたときに最新の版を確かめ、違っていたら自動で読み込み直す。
  var VERSION = "2026-11-17-2";          // 公開のたびに書き換える
  $("ver").textContent = "版 " + VERSION;
  (function checkUpdate() {
    if (!window.fetch || location.protocol.indexOf("http") !== 0) return;
    fetch(location.pathname + "?_=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.text() : ""; })
      .then(function (html) {
        var m = /var VERSION = "([^"]+)"/.exec(html);
        if (!m || m[1] === VERSION) return;
        var tried = "";
        try { tried = sessionStorage.getItem("prompter.upd") || ""; sessionStorage.setItem("prompter.upd", m[1]); } catch (e) {}
        if (tried === m[1] || $("edit").hidden) return;   // 同じ版で繰り返さない。読んでいる最中は切り替えない
        location.replace(location.pathname + "?v=" + encodeURIComponent(m[1]));
      })
      .catch(function () {});
  })();

  var SAMPLE =
    "こんにちは。これはサンプルの原稿です。\n\n" +
    "声に出して読むと、読んでいる文の色が反転し、画面が自動で進みます。\n\n" +
    "途中で止まれば、画面も止まります。原稿にない話をしている間は、その場で待っています。\n\n" +
    "原稿に戻って読み始めると、また続きから進みます。\n\n" +
    "この文章を消して、ご自分の原稿を貼り付けてください。";

  // ---- 保存(この端末のブラウザ内だけ) ----
  function load(key, fallback) {
    try { var v = localStorage.getItem("prompter." + key); return v === null ? fallback : v; }
    catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem("prompter." + key, value); } catch (e) {}
  }

  // ---- 文字の正規化:句読点と空白を除き、カタカナはひらがなに揃える ----
  function normChar(ch) {
    var c = ch.charCodeAt(0);
    if (c >= 0x30A1 && c <= 0x30F6) return String.fromCharCode(c - 0x60);       // カタカナ→ひらがな
    if (c >= 0xFF10 && c <= 0xFF5A) ch = String.fromCharCode(c - 0xFEE0);       // 全角英数→半角
    return ch.toLowerCase();
  }
  var KEEP = /[\p{L}\p{N}]/u;
  function normalize(str) {
    var chars = [], map = [];
    for (var i = 0; i < str.length; i++) {
      var ch = str[i];
      if (KEEP.test(ch)) { chars.push(normChar(ch)); map.push(i); }
    }
    return { chars: chars, map: map };
  }

  // ---- 原稿の状態 ----
  var text = "", N = [], MAP = [], SEGS = [], pos = 0;   // pos = 読み終えた文字数(正規化後)

  // 文の区切り。長い文は読点でも区切る。
  function buildSegments(str) {
    var segs = [], start = 0;
    function push(end) { if (end > start) { segs.push({ start: start, end: end }); start = end; } }
    for (var i = 0; i < str.length; i++) {
      var ch = str[i];
      var hard = "。！？!?\n".indexOf(ch) >= 0;
      var soft = "、,".indexOf(ch) >= 0 && i - start >= 28;
      if (hard || soft) {
        var j = i + 1;
        while (j < str.length && "。！？!?、」』）)".indexOf(str[j]) >= 0) j++;
        push(j); i = j - 1;
      }
    }
    push(str.length);
    // 読む文字を含まない区切り(空行など)は前の文にまとめる
    var out = [];
    segs.forEach(function (s) {
      if (KEEP.test(str.slice(s.start, s.end)) || !out.length) out.push(s);
      else out[out.length - 1].end = s.end;
    });
    return out;
  }

  function setScript(str) {
    text = str;
    var n = normalize(str);
    N = n.chars; MAP = n.map;
    SEGS = buildSegments(str);
    pos = 0;
  }

  // ---- 照合:聞こえた言葉の末尾を、現在位置の少し先までの原稿から探す ----
  // 多少の聞き違い・漢字の違いは許容する(あいまい一致)。見つからなければ位置を保つ。
  // 原則は「上から順番に」。同じ言葉が先にも出てくる原稿で、勝手に先へ飛ばないようにしている。
  var BACK = 30, NEAR = 45, FAR = 400;

  // 原稿の from〜to の各位置について「そこで終わる部分と tail の違いの数」を返す
  function scan(tail, from, to) {
    var m = tail.length, prev = [], cur = [], out = [], i, j;
    from = Math.max(0, from); to = Math.min(N.length, to);
    for (i = 0; i <= m; i++) prev[i] = i;
    for (j = from; j < to; j++) {
      cur[0] = 0;
      for (i = 1; i <= m; i++) {
        cur[i] = Math.min(prev[i - 1] + (tail[i - 1] === N[j] ? 0 : 1), prev[i] + 1, cur[i - 1] + 1);
      }
      // last = 最後の1文字が原稿と一致しているか(位置が1〜2文字ずれないように必ず見る)
      out.push({ end: j + 1, err: cur[m], last: tail[m - 1] === N[j] });
      var t = prev; prev = cur; cur = t;
    }
    return out;
  }
  function errAt(tail, end) {
    var r = scan(tail, end - tail.length * 2, end);
    return r.length ? r[r.length - 1].err : Infinity;
  }

  function locate(heard) {
    var all = normalize(heard).chars;
    if (all.length > 80) all = all.slice(-80);
    var tail = all.slice(-8), m = tail.length;
    if (m < 2) return pos;
    if (m < 4) {                         // 話し始めの数文字は、続きと完全一致のときだけ進める
      for (var i = 0; i < m; i++) if (N[pos + i] !== tail[i]) return pos;
      return pos + m;
    }
    var maxErr = m >= 8 ? 2 : m >= 5 ? 1 : 0;

    // 1) 近くを探す。先(ahead)だけでなく、もう読んだ所(behind)に同じ言葉があるかも見る
    var ahead = null, behind = null;
    scan(tail, pos - BACK, pos + NEAR).forEach(function (c) {
      if (!c.last || c.err > maxErr) return;
      if (c.end > pos) {
        var score = c.err * 10 + (c.end - pos);
        if (!ahead || score < ahead.score) ahead = { end: c.end, err: c.err, score: score };
      } else if (!behind || c.err < behind.err || (c.err === behind.err && c.end > behind.end)) {
        behind = c;
      }
    });
    if (ahead) {
      var ok = true;
      // 同じ言葉が読み終えた所にもある(=読み終えた言葉がもう一度届いただけかもしれない)
      // → もっと長い文脈で比べて、先のほうがはっきり合うときだけ進む
      if (behind && behind.err <= ahead.err) {
        var L = Math.min(all.length, 24);
        if (L <= m) ok = false;
        else { var lt = all.slice(-L); ok = errAt(lt, ahead.end) < errAt(lt, behind.end); }
      }
      // 間を飛ばして進むときは、飛ばした部分も聞こえた言葉に含まれていること
      var gap = ahead.end - pos;
      if (ok && gap > m) {
        var L2 = Math.min(all.length, gap + 4);
        ok = L2 >= gap - 2 && errAt(all.slice(-L2), ahead.end) <= Math.max(2, Math.floor(L2 * 0.2));
      }
      if (ok) return ahead.end;
    }

    // 2) 文を飛ばして読んだ場合:12文字が完全に一致し、その場所が1か所だけのときに限って追いつく
    if (all.length < 12) return pos;
    var t12 = all.slice(-12), best = null, first = -1, lastEnd = -1, seenBehind = false;
    scan(t12, pos - BACK, pos + FAR).forEach(function (c) {
      if (c.err > 0) return;
      if (c.end <= pos) { seenBehind = true; return; }
      if (first < 0) first = c.end;
      lastEnd = c.end;
      if (!best || c.err < best.err) best = c;
    });
    if (seenBehind || !best || lastEnd - first > 3) return pos;
    return best.end;
  }

  // ---- 表示 ----
  var elPast = $("past"), elRead = $("curRead"), elNext = $("curNext"), elFuture = $("future");
  var scroller = $("scroller"), scriptEl = $("script");

  function segIndexAt(orig) {
    for (var i = 0; i < SEGS.length; i++) if (orig < SEGS[i].end) return i;
    return SEGS.length - 1;
  }
  function currentSeg() {
    if (pos >= N.length) return -1;      // 読み終わり
    return segIndexAt(MAP[pos]);
  }

  // 音声認識は声より少し遅れて届く。その分を見越して、文の終わりの数文字まで来たら次の文へ色を移す。
  var LEAD = 5;
  function displaySeg() {
    var si = currentSeg();
    if (si < 0 || si + 1 >= SEGS.length) return si;
    var a = segStartPos(si), b = segStartPos(si + 1);
    var lead = Math.min(LEAD, Math.floor((b - a) / 3));   // 短い文は早送りしすぎない
    return pos > a && b - pos <= lead ? si + 1 : si;
  }

  function render(instant) {
    var si = displaySeg();
    if (si < 0) {
      elPast.textContent = text; elRead.textContent = ""; elNext.textContent = ""; elFuture.textContent = "";
      return;
    }
    var seg = SEGS[si];
    var s = seg.start, e = seg.end;
    while (s < e && /\s/.test(text[s])) s++;          // 反転の帯に改行や空白を含めない
    while (e > s && /\s/.test(text[e - 1])) e--;
    var cut = Math.min(Math.max(MAP[pos], s), e);     // 次に読む文字の位置
    elPast.textContent = text.slice(0, s);
    elRead.textContent = text.slice(s, cut);
    elNext.textContent = text.slice(cut, e);
    elFuture.textContent = text.slice(e);
    var anchor = elRead.textContent ? elRead : elNext;
    var target = Math.max(0, anchor.offsetTop - scroller.clientHeight * 0.28);
    if (Math.abs(scroller.scrollTop - target) > 4) {
      scroller.scrollTo({ top: target, behavior: instant ? "auto" : "smooth" });
    }
  }

  function moveTo(newPos, instant) {
    pos = Math.max(0, Math.min(N.length, newPos));
    render(instant);
  }
  function segStartPos(si) {             // 文の先頭にあたる正規化位置
    var orig = SEGS[si].start;
    for (var i = 0; i < MAP.length; i++) if (MAP[i] >= orig) return i;
    return N.length;
  }
  function stepSegment(dir) {
    var si = currentSeg();
    if (si < 0) si = SEGS.length;
    if (dir < 0) {
      var atStart = si < SEGS.length && segStartPos(si) === pos;
      si = Math.max(0, atStart || si === SEGS.length ? si - 1 : si);
      moveTo(segStartPos(si), false);
    } else {
      moveTo(si + 1 < SEGS.length ? segStartPos(si + 1) : N.length, false);
    }
  }

  // ---- 文字サイズ・左右反転 ----
  var fontSize = parseInt(load("font", "48"), 10) || 48;
  var mirrored = load("mirror", "0") === "1";
  var ALIGNS = ["left", "center", "right"], ALIGN_LABEL = { left: "左", center: "中央", right: "右" };
  var align = load("align", "left");
  if (ALIGNS.indexOf(align) < 0) align = "left";
  function applyLook() {
    scriptEl.style.textAlign = align;
    // 揃えボタンの絵(3本線)を、今の揃えに合わせて描く
    var lines = "";
    [[16, 6], [10, 12], [14, 18]].forEach(function (l) {
      var x = align === "left" ? 4 : align === "center" ? 12 - l[0] / 2 : 20 - l[0];
      lines += '<path d="M' + x + " " + l[1] + "h" + l[0] + '"/>';
    });
    $("align").firstElementChild.innerHTML = lines;
    $("align").setAttribute("aria-label", "揃え：" + ALIGN_LABEL[align]);
    scriptEl.style.fontSize = fontSize + "px";
    scriptEl.classList.toggle("mirror", mirrored);
    $("mirror").setAttribute("aria-pressed", mirrored ? "true" : "false");
  }
  function changeFont(delta) {
    fontSize = Math.max(20, Math.min(140, fontSize + delta));
    save("font", String(fontSize));
    applyLook(); render(true);
  }

  // ---- 音声認識 ----
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, running = false, restartTimer = 0, wakeLock = null;
  var micEl = $("mic"), micText = $("micText");

  function setMic(state, label) {
    micEl.className = state; micText.textContent = label;
  }

  function startListening() {
    if (!SR || !running) return;
    try { if (rec) { rec.onend = null; rec.abort(); } } catch (e) {}
    rec = new SR();
    rec.lang = "ja-JP";
    rec.continuous = true;
    rec.interimResults = true;
    rec.onstart = function () { setMic("on", "聞いています"); };
    rec.onresult = function (ev) {
      var heard = "";
      for (var i = Math.max(0, ev.results.length - 2); i < ev.results.length; i++) {
        heard += ev.results[i][0].transcript;
      }
      var p = locate(heard);
      if (p !== pos) moveTo(p, false);
    };
    rec.onerror = function (ev) {
      if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
        running = false;
        setMic("err", "許可なし");       // マイクが許可されていない
      } else if (ev.error === "audio-capture") {
        running = false;
        setMic("err", "マイクなし");     // マイクが見つからない
      }
      // no-speech / aborted / network は onend で自動的に再開する
    };
    rec.onend = function () {
      if (!running) return;
      setMic("", "再接続中");
      clearTimeout(restartTimer);
      restartTimer = setTimeout(startListening, 300);
    };
    try { rec.start(); }
    catch (e) { clearTimeout(restartTimer); restartTimer = setTimeout(startListening, 600); }
  }

  function stopListening() {
    running = false;
    clearTimeout(restartTimer);
    try { if (rec) { rec.onend = null; rec.abort(); } } catch (e) {}
    rec = null;
  }

  function keepAwake() {                 // 読んでいる間、画面が暗くならないようにする
    if (!navigator.wakeLock || !running) return;
    navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {});
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && running) { keepAwake(); startListening(); }
  });

  // ---- 画面の切り替え ----
  var textEl = $("text");
  textEl.value = load("text", SAMPLE);
  textEl.addEventListener("input", function () { save("text", textEl.value); forgetCleared(); });

  // 原稿を消す。押し間違いに備えて、次に何か入れるまでは「元に戻す」で戻せる
  var clearEl = $("clear"), cleared = null;
  function forgetCleared() { cleared = null; clearEl.textContent = "原稿を消す"; }
  clearEl.addEventListener("click", function () {
    if (cleared !== null) {
      textEl.value = cleared; save("text", cleared); forgetCleared();
      return;
    }
    if (!textEl.value) return;
    cleared = textEl.value;
    textEl.value = ""; save("text", "");
    clearEl.textContent = "元に戻す";
    showInfo("原稿を消しました。間違えたときは「元に戻す」を押してください。");
  });

  if (!SR) {
    var n = $("notice");
    n.hidden = false;
    n.textContent = "このブラウザは音声認識に対応していません。Safari(iPhone・iPad・Mac)またはChromeで開いてください。";
  }

  $("start").addEventListener("click", function () {
    var str = textEl.value.replace(/\r\n?/g, "\n").trim();
    if (!str) { textEl.focus(); return; }
    setScript(str);
    $("edit").hidden = true;
    $("stage").hidden = false;
    applyLook();
    scroller.scrollTop = 0;
    render(true);
    if (SR) { running = true; setMic("", "準備中"); startListening(); keepAwake(); }
    else setMic("err", "認識不可");       // 音声認識が使えないブラウザ(手動で進める)
  });

  $("back").addEventListener("click", function () {
    stopListening();
    if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
    $("stage").hidden = true;
    $("edit").hidden = false;
  });
  $("top").addEventListener("click", function () { moveTo(0, false); });
  $("prev").addEventListener("click", function () { stepSegment(-1); });
  $("next").addEventListener("click", function () { stepSegment(1); });
  $("smaller").addEventListener("click", function () { changeFont(-6); });
  $("bigger").addEventListener("click", function () { changeFont(6); });
  $("align").addEventListener("click", function () {
    align = ALIGNS[(ALIGNS.indexOf(align) + 1) % ALIGNS.length];
    save("align", align); applyLook(); render(true);
  });
  $("mirror").addEventListener("click", function () {
    mirrored = !mirrored; save("mirror", mirrored ? "1" : "0"); applyLook();
  });
  // マイクが止まったときは、表示をタップして再開できる
  micEl.addEventListener("click", function () {
    if (!running && SR) { running = true; setMic("", "準備中"); startListening(); keepAwake(); }
  });

  // ---- QRコードで原稿を送る・受け取る ----
  // 原稿を圧縮して小分けにし、QRコードを順番に切り替えて表示する。受け取る側はカメラで全部集めて元に戻す。
  // 原稿はQRコードの中にだけ入り、ネットには送られない。
  var QR_LIB = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
  var SCAN_LIB = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";
  var CHUNK = 480, FRAME_MS = 350;
  var qrEl = $("qr"), qrMsg = $("qrMsg"), qrProg = $("qrProg"), qrCanvas = $("qrCanvas"), qrVideo = $("qrVideo");
  var qrTimer = 0, qrRaf = 0, qrStream = null, qrOpen = false;

  function loadScript(src, name) {
    if (window[name]) return Promise.resolve();
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = src; s.onload = resolve; s.onerror = function () { reject(new Error("load")); };
      document.head.appendChild(s);
    });
  }
  function toB64(u8) {
    var s = "";
    for (var i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
    return btoa(s);
  }
  function fromB64(b) {
    var s = atob(b), u = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
    return u;
  }
  function pipe(u8, Stream) {
    return new Response(new Blob([u8]).stream().pipeThrough(new Stream("deflate"))).arrayBuffer()
      .then(function (b) { return new Uint8Array(b); });
  }
  function pack(str) {                   // 先頭の1文字:z=圧縮あり / r=圧縮なし
    var u = new TextEncoder().encode(str);
    if (!window.CompressionStream) return Promise.resolve("r" + toB64(u));
    return pipe(u, window.CompressionStream).then(function (z) { return "z" + toB64(z); })
      .catch(function () { return "r" + toB64(u); });
  }
  function unpack(p) {
    var u = fromB64(p.slice(1));
    if (p[0] === "r") return Promise.resolve(new TextDecoder().decode(u));
    if (!window.DecompressionStream) return Promise.reject(new Error("unsupported"));
    return pipe(u, window.DecompressionStream).then(function (d) { return new TextDecoder().decode(d); });
  }
  function makeFrames(payload) {
    var id = Math.random().toString(36).slice(2, 6).padEnd(4, "0");
    var n = Math.max(1, Math.ceil(payload.length / CHUNK)), frames = [];
    for (var i = 0; i < n; i++) frames.push("PR1:" + id + ":" + i + ":" + n + ":" + payload.slice(i * CHUNK, (i + 1) * CHUNK));
    return frames;
  }
  function newReceiver() {               // 読み取ったQRを集める。全部そろったら中身を返す
    var id = "", n = 0, parts = [], got = 0;
    return {
      get got() { return got; }, get total() { return n; },
      add: function (text) {
        var m = /^PR1:([a-z0-9]{4}):(\d+):(\d+):([\s\S]*)$/.exec(text);
        if (!m) return null;
        if (m[1] !== id || +m[3] !== n) { id = m[1]; n = +m[3]; parts = []; got = 0; }
        var i = +m[2];
        if (i >= n) return null;
        if (parts[i] === undefined) { parts[i] = m[4]; got++; }
        return got === n ? parts.join("") : null;
      }
    };
  }

  function drawQR(text) {
    var q = window.qrcode(0, "L");
    q.addData(text); q.make();
    var n = q.getModuleCount(), cell = 6, pad = 4;
    qrCanvas.width = qrCanvas.height = (n + pad * 2) * cell;
    var g = qrCanvas.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, qrCanvas.width, qrCanvas.height);
    g.fillStyle = "#000";
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) {
      if (q.isDark(r, c)) g.fillRect((c + pad) * cell, (r + pad) * cell, cell, cell);
    }
  }

  function openQR(msg) {
    qrOpen = true;
    qrMsg.textContent = msg; qrProg.textContent = "";
    qrCanvas.hidden = true; qrVideo.hidden = true;
    qrEl.hidden = false;
  }
  function closeQR() {
    qrOpen = false;
    clearInterval(qrTimer); cancelAnimationFrame(qrRaf);
    if (qrStream) { qrStream.getTracks().forEach(function (t) { t.stop(); }); qrStream = null; }
    qrVideo.srcObject = null;
    qrEl.hidden = true;
  }
  function showInfo(msg) {
    var el = $("info");
    el.textContent = msg; el.hidden = false;
    setTimeout(function () { el.hidden = true; }, 6000);
  }

  // 送る側(パソコン):原稿をQRコードにして表示する
  $("send").addEventListener("click", function () {
    var str = textEl.value.replace(/\r\n?/g, "\n").trim();
    if (!str) { textEl.focus(); return; }
    openQR("QRコードを作っています…");
    Promise.all([loadScript(QR_LIB, "qrcode"), pack(str)]).then(function (res) {
      if (!qrOpen) return;
      var frames = makeFrames(res[1]), i = 0;
      qrMsg.textContent = "スマホのプロンプターで「QRで受け取る」を押して、このQRコードを映してください。";
      qrCanvas.hidden = false;
      drawQR(frames[0]);
      if (frames.length > 1) {
        qrProg.textContent = "QRコードが自動で切り替わります(全" + frames.length + "枚)。そのまま映し続けてください。";
        qrTimer = setInterval(function () { i = (i + 1) % frames.length; drawQR(frames[i]); }, FRAME_MS);
      }
    }).catch(function () {
      if (qrOpen) qrMsg.textContent = "QRコードを作れませんでした。ネットにつながっているか確認して、もう一度お試しください。";
    });
  });

  // 受け取る側(スマホ):カメラでQRコードを読み取り、原稿欄に入れる
  $("recv").addEventListener("click", function () {
    openQR("カメラを準備しています…");
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      qrMsg.textContent = "このブラウザではカメラが使えません。";
      return;
    }
    var rx = newReceiver(), work = document.createElement("canvas"), done = false;
    Promise.all([
      loadScript(SCAN_LIB, "jsQR"),
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
    ]).then(function (res) {
      if (!qrOpen) { res[1].getTracks().forEach(function (t) { t.stop(); }); return; }
      qrStream = res[1];
      qrVideo.srcObject = qrStream; qrVideo.hidden = false;
      qrVideo.play().catch(function () {});
      qrMsg.textContent = "パソコンに出ているQRコードを映してください。";
      (function tick() {
        if (!qrOpen || done) return;
        qrRaf = requestAnimationFrame(tick);
        var vw = qrVideo.videoWidth, vh = qrVideo.videoHeight;
        if (!vw || !vh) return;
        var k = Math.min(1, 720 / Math.max(vw, vh));
        work.width = Math.round(vw * k); work.height = Math.round(vh * k);
        var g = work.getContext("2d", { willReadFrequently: true });
        g.drawImage(qrVideo, 0, 0, work.width, work.height);
        var img = g.getImageData(0, 0, work.width, work.height);
        var hit = window.jsQR(img.data, img.width, img.height, { inversionAttempts: "dontInvert" });
        if (!hit || !hit.data) return;
        var payload = rx.add(hit.data);
        if (rx.total) qrProg.textContent = rx.got + " / " + rx.total + " 枚 受け取りました";
        if (payload === null) return;
        done = true;
        unpack(payload).then(function (str) {
          textEl.value = str; save("text", str); forgetCleared();
          closeQR();
          showInfo("原稿を受け取りました(" + str.length + "文字)。");
        }).catch(function () {
          qrMsg.textContent = "原稿を元に戻せませんでした。もう一度お試しください。";
        });
      })();
    }).catch(function (e) {
      if (!qrOpen) return;
      qrMsg.textContent = e && e.message === "load"
        ? "読み取りの準備ができませんでした。ネットにつながっているか確認してください。"
        : "カメラが使えません。カメラの許可を確認してください。";
    });
  });
  $("qrClose").addEventListener("click", closeQR);

  // テスト用に照合ロジックを公開
  window.__prompter = { setScript: setScript, locate: locate, get pos() { return pos; }, set pos(v) { pos = v; }, get N() { return N; }, get SEGS() { return SEGS; }, displaySeg: displaySeg, currentSeg: currentSeg,
    qr: { pack: pack, unpack: unpack, makeFrames: makeFrames, newReceiver: newReceiver, drawQR: drawQR, loadScript: loadScript, QR_LIB: QR_LIB, SCAN_LIB: SCAN_LIB } };
})();
</script>
</body>
</html>
